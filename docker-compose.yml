services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: job_scheduler
      POSTGRES_USER: burhaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burhaan -d job_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "if [ -z \"$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes; else exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\"; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$REDIS_PASSWORD\" ]; then redis-cli ping | grep -q PONG; else redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    command: ["-path", "/migrations", "-database", "postgres://burhaan:${POSTGRES_PASSWORD}@postgres:5432/job_scheduler?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      JOB_SCHEDULER_DB_DSN: postgres://burhaan:${POSTGRES_PASSWORD}@postgres:5432/job_scheduler?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-500ms}
      # Dev-only: submit-time SSRF validation must accept the in-network demo
      # sink (http://callback:8080/hook), mirroring the worker flag below.
      # Production task definitions deliberately OMIT this, keeping the
      # SSRF guard strict end to end.
      JOB_SCHEDULER_ALLOW_PRIVATE_IPS: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      JOB_SCHEDULER_DB_DSN: postgres://burhaan:${POSTGRES_PASSWORD}@postgres:5432/job_scheduler?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-500ms}
      # Instance identity for leader election. Empty default lets the binary
      # fall back to hostname-uuid (unique per replica), which is required
      # for correct failover observability when scaled past 1. The old
      # ${HOSTNAME:-scheduler-1} gave every replica the SAME id.
      SCHEDULER_INSTANCE_ID: ${SCHEDULER_INSTANCE_ID:-}
    healthcheck:
      test: ["CMD", "/scheduler", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      JOB_SCHEDULER_DB_DSN: postgres://burhaan:${POSTGRES_PASSWORD}@postgres:5432/job_scheduler?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-500ms}
      # Dev-only: lets the demo callback sink (http://callback:8080/hook,
      # a private compose-network address) receive webhooks. Production task
      # definitions deliberately OMIT this, keeping the SSRF guard strict.
      JOB_SCHEDULER_ALLOW_PRIVATE_IPS: "true"
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      callback:
        condition: service_healthy
    restart: unless-stopped
    # Scale with: docker compose up --scale worker=2

  # One-shot key provisioning (ops tooling, not a service; off by default).
  # Usage: docker compose --profile tools run --rm apikey --client-name demo
  # Prints the raw key once — save it. Needs no host ports or local Go.
  apikey:
    build:
      context: .
      dockerfile: Dockerfile.apikey
    environment:
      JOB_SCHEDULER_DB_DSN: postgres://burhaan:${POSTGRES_PASSWORD}@postgres:5432/job_scheduler?sslmode=disable
      REDIS_ADDR: redis:6379
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  # Public demo callback sink: receives job webhooks at POST /hook, shows them
  # at GET / (auto-refreshing page) and GET /hits (JSON). In-network jobs use
  # http://callback:8080/hook. Publish 8080 to share the demo page publicly.
  # SINK_FAIL_FIRST=N makes the first N hook calls fail (retry demo).
  callback:
    build:
      context: .
      dockerfile: Dockerfile.callback
    environment:
      PORT: 8080
      SINK_FAIL_FIRST: ${SINK_FAIL_FIRST:-0}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/callback", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # TLS reverse proxy for PUBLIC hosting (see README Deployment section). Off by default;
  # start with: DOMAIN=jobs.example.com docker compose --profile public up -d
  # Requires the domain's DNS A-record to point at this host first.
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Empty until you set DOMAIN (Caddy refuses to start without a site
      # address, which is the loud failure we want for a missing domain).
      DOMAIN: ${DOMAIN:-}
    depends_on:
      api:
        condition: service_healthy
      callback:
        condition: service_healthy
    profiles: ["public"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
