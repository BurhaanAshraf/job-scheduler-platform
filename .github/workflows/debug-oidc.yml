# TEMPORARY diagnostic for 14.1 (delete after OIDC works).
name: Debug OIDC claims

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims (iss/sub/aud only)
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import base64, sys, json
          s = sys.stdin.read().strip()
          claims = json.loads(base64.urlsafe_b64decode(s + '=' * (-len(s) % 4)))
          print(json.dumps({k: claims[k] for k in ('iss', 'sub', 'aud') if k in claims}, indent=2))
          "
