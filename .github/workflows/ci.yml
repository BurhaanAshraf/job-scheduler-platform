name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (cheaper, faster signal).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  POSTGRES_PASSWORD: ci-password
  JOB_SCHEDULER_DB_DSN: postgres://burhaan:ci-password@localhost:5432/job_scheduler?sslmode=disable
  REDIS_ADDR: localhost:6379
  REDIS_PASSWORD: ""
  API_PORT: 4000
  LOG_LEVEL: info
  DB_MAX_CONNS: 10
  SCHEDULER_POLL_INTERVAL: 500ms

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: run ./...

  test:
    name: test (race + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_scheduler
          POSTGRES_USER: burhaan
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burhaan -d job_scheduler"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golang-migrate
        run: |
          curl -sSfL -o /tmp/migrate.tar.gz \
            https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz
          tar -xzf /tmp/migrate.tar.gz -C /tmp
          sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version
      - name: Migrate test database
        run: make migrate-up
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Serial, no cache: integration tests share one Postgres + Redis.
      - name: Test with race detector
        run: go test -race ./... -p 1 -count=1 -coverprofile=coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Builds every image (api/scheduler/worker/callback). A broken
      # Dockerfile fails the run here, before any merge.
      - name: Build all images
        run: docker compose build
