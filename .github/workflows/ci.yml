name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (cheaper, faster signal).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  POSTGRES_PASSWORD: ci-password
  JOB_SCHEDULER_DB_DSN: postgres://burhaan:ci-password@localhost:5432/job_scheduler?sslmode=disable
  REDIS_ADDR: localhost:6379
  REDIS_PASSWORD: ""
  API_PORT: 4000
  LOG_LEVEL: info
  DB_MAX_CONNS: 10
  SCHEDULER_POLL_INTERVAL: 500ms

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: ./...

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --verbose --redact

  vuln-scan:
    name: vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: test (race + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_scheduler
          POSTGRES_USER: burhaan
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burhaan -d job_scheduler"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golang-migrate
        run: |
          curl -sSfL -o /tmp/migrate.tar.gz \
            https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz
          tar -xzf /tmp/migrate.tar.gz -C /tmp
          sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version
      - name: Migrate test database
        run: make migrate-up
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Serial, no cache: integration tests share one Postgres + Redis.
      - name: Test with race detector
        run: go test -race ./... -p 1 -count=1 -coverprofile=coverage.out 2>&1 | tee test.log
      - name: Check coverage threshold (70% on internal/)
        run: |
          # NOTE: coverprofile lines start with the full module path
          # (github.com/.../internal/...), so match 'internal/' anywhere.
          go tool cover -func=coverage.out | awk '/internal\// {total+=$3; count++} END {if (count>0) print int(total/count); else print 0}' > /tmp/coverage_pct.txt
          COV=$(cat /tmp/coverage_pct.txt)
          echo "Average coverage on internal/: ${COV}%"
          if [ "$COV" -lt 70 ]; then
            echo "FAIL: Coverage ${COV}% is below 70% threshold"
            exit 1
          fi
          echo "PASS: Coverage meets 70% threshold"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Builds every image (api/scheduler/worker/callback). A broken
      # Dockerfile fails the run here, before any merge.
      - name: Build all images
        run: docker compose build
      # Dockerfile.migrate has no compose service, so build it explicitly:
      # a broken migrate image must fail CI, not production deploys.
      - name: Build migrate image
        run: docker build -f Dockerfile.migrate .

  # Terraform checks (lint-level on every PR; full plan only when OIDC is
  # wired via vars.AWS_OIDC_PLAN_ENABLED — per-PR path filtering is not
  # possible at job level, so fmt+validate run on all PRs by design).
  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC-gated dev plan step below (minting the ID
      # token via aws-actions/configure-aws-credentials). Without this,
      # enabling AWS_OIDC_PLAN_ENABLED fails closed instead of planning.
      id-token: write
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform init (no backend - lint only)
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=terraform validate
      # Full plan against dev needs state access: runs only when the repo
      # has OIDC wired (same deploy role Terraform creates). Dummy password:
      # plan never reads the real secret value.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_OIDC_PLAN_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-2
      - name: Terraform plan (dev)
        if: vars.AWS_OIDC_PLAN_ENABLED == 'true'
        run: terraform -chdir=terraform init -reconfigure -backend-config=backend-dev.hcl && terraform -chdir=terraform plan -no-color -var-file=dev.tfvars -input=false
        env:
          TF_VAR_db_password: "ci-plan-dummy-password-0123456789"