name: Deploy to ECS

# Section 14.2/14.3: on merge to main, build, push, roll the DEV services,
# then smoke-test the live ALB. Prod deploys via manual dispatch only.
# No static AWS keys (14.1): auth is OIDC via the Terraform-managed role.
on:
  # NOTE: automatic deploy on push to main is intentionally OFF until the
  # AWS side is wired (OIDC deploy role + repo secrets). Merging currently
  # only runs CI. Re-enable the push trigger (and delete this note) once a
  # manual workflow_dispatch deploy has gone green end to end.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: ["dev", "prod"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "852922980193"
  ECR_REGISTRY: 852922980193.dkr.ecr.ap-south-2.amazonaws.com

jobs:
  deploy:
    name: build, push, roll services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      # Role names are Terraform outputs: <env>-github-deploy
      # (terraform/modules/github-oidc). Both roles trust this same repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::852922980193:role/${{ steps.env.outputs.name }}-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve names from Terraform state
        id: tf
        run: |
          ENV="${{ steps.env.outputs.name }}"
          echo "cluster=${ENV}-job-scheduler" >> "$GITHUB_OUTPUT"
          echo "repo_prefix=${ENV}-job-scheduler" >> "$GITHUB_OUTPUT"
          ALB=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?starts_with(LoadBalancerName, \`${ENV}-job-scheduler-alb\`)].DNSName" \
            --output text)
          echo "alb_dns=${ALB}" >> "$GITHUB_OUTPUT"
          echo "ALB=${ALB}"

      - name: Build and push images (:sha)
        run: |
          set -e
          for svc in api scheduler worker; do
            docker build -f Dockerfile.${svc} \
              -t $ECR_REGISTRY/${{ steps.tf.outputs.repo_prefix }}-${svc}:${{ github.sha }} .
            docker push $ECR_REGISTRY/${{ steps.tf.outputs.repo_prefix }}-${svc}:${{ github.sha }}
          done

      - name: Register new task definition revisions
        run: |
          set -e
          for svc in api scheduler worker; do
            aws ecs describe-task-definition \
              --task-definition ${{ steps.tf.outputs.repo_prefix }}-${svc} \
              --query 'taskDefinition' > /tmp/td-${svc}.json
            python3 - /tmp/td-${svc}.json $ECR_REGISTRY/${{ steps.tf.outputs.repo_prefix }}-${svc}:${{ github.sha }} <<'EOF'
          import json, sys
          path, image = sys.argv[1], sys.argv[2]
          td = json.load(open(path))
          for k in ("taskDefinitionArn", "revision", "status", "registeredAt",
                    "registeredBy", "compatibilities", "requiresAttributes"):
              td.pop(k, None)
          td["containerDefinitions"][0]["image"] = image
          json.dump(td, open(path, "w"))
          EOF
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/td-${svc}.json \
              --query 'taskDefinition.revision' --output text
          done

      - name: Roll the services
        run: |
          set -e
          CLUSTER="${{ steps.tf.outputs.cluster }}"
          PREFIX="${{ steps.tf.outputs.repo_prefix }}"
          aws ecs update-service --cluster "$CLUSTER" \
            --service "${PREFIX}-api" --force-new-deployment \
            --query 'service.deployments[0].taskDefinition' --output text
          aws ecs update-service --cluster "$CLUSTER" \
            --service "${PREFIX}-scheduler" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" \
            --service "${PREFIX}-worker" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "${PREFIX}-api" "${PREFIX}-scheduler" "${PREFIX}-worker"

      - name: Post-deploy smoke test (14.3)
        run: |
          set -e
          URL="http://${{ steps.tf.outputs.alb_dns }}/healthz"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo SMOKE-OK; exit 0; fi
            sleep 10
          done
          echo "SMOKE-FAILED: $URL never returned 200" >&2
          exit 1
