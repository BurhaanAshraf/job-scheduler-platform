name: Deploy to ECS

# Section 14.2/14.3: on merge to main, build, push, roll the ECS services,
# then smoke-test the live ALB. No static AWS keys (14.1): auth is OIDC.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "852922980193"
  ECR_REGISTRY: 852922980193.dkr.ecr.ap-south-2.amazonaws.com
  ECS_CLUSTER: job-scheduler
  ALB_HEALTH_URL: http://job-scheduler-alb-172264349.ap-south-2.elb.amazonaws.com/healthz
  DEPLOY_ROLE: arn:aws:iam::852922980193:role/job-scheduler-github-deploy

jobs:
  deploy:
    name: build, push, roll services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (:sha + :latest)
        run: |
          set -e
          for svc in api scheduler worker; do
            docker build -f Dockerfile.${svc} \
              -t $ECR_REGISTRY/job-scheduler-${svc}:${{ github.sha }} \
              -t $ECR_REGISTRY/job-scheduler-${svc}:latest .
            docker push $ECR_REGISTRY/job-scheduler-${svc}:${{ github.sha }}
            docker push $ECR_REGISTRY/job-scheduler-${svc}:latest
          done

      - name: Register new task definition revisions
        run: |
          set -e
          for svc in api scheduler worker; do
            aws ecs describe-task-definition \
              --task-definition job-scheduler-${svc} \
              --query 'taskDefinition' > /tmp/td-${svc}.json
            python3 - /tmp/td-${svc}.json $ECR_REGISTRY/job-scheduler-${svc}:${{ github.sha }} <<'EOF'
          import json, sys
          path, image = sys.argv[1], sys.argv[2]
          td = json.load(open(path))
          for k in ("taskDefinitionArn", "revision", "status", "registeredAt",
                    "registeredBy", "compatibilities", "requiresAttributes"):
              td.pop(k, None)
          td["containerDefinitions"][0]["image"] = image
          json.dump(td, open(path, "w"))
          EOF
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/td-${svc}.json \
              --query 'taskDefinition.revision' --output text
          done

      - name: Roll the services
        run: |
          set -e
          aws ecs update-service --cluster $ECS_CLUSTER \
            --service job-scheduler-api --force-new-deployment \
            --query 'service.deployments[0].taskDefinition' --output text
          aws ecs update-service --cluster $ECS_CLUSTER \
            --service job-scheduler-scheduler --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER \
            --service job-scheduler-worker --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER \
            --services job-scheduler-api job-scheduler-scheduler job-scheduler-worker

      - name: Post-deploy smoke test (14.3)
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$ALB_HEALTH_URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo SMOKE-OK; exit 0; fi
            sleep 10
          done
          echo "SMOKE-FAILED: $ALB_HEALTH_URL never returned 200" >&2
          exit 1
